# Локальний запуск усього сервісу: docker compose up --build
# Відкрити: http://localhost:8000  (документація API: http://localhost:8000/docs)
name: codeinspector

services:
  db:
    image: postgres:16-alpine
    container_name: codeinspector-db
    environment:
      POSTGRES_DB: codeinspector
      POSTGRES_USER: codeinspector
      POSTGRES_PASSWORD: codeinspector
    volumes:
      - codeinspector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeinspector -d codeinspector"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: codeinspector-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://codeinspector:codeinspector@db:5432/codeinspector
      SECRET_KEY: local-dev-secret-change-me
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"

volumes:
  codeinspector_pgdata:
